<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% unless page.noindex or page.url == "/404.html" %}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
{% else %}
<meta name="robots" content="noindex, follow">
{% endunless %}
{% if page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% else %}
<meta name="description"
    content="Yuguang XIAO is a PhD student and doctoral researcher at UGE, working in probability, mathematical statistical mechanics, long-range models, and random interfaces.">
{% endif %}
<meta name="keywords"
    content="Yuguang XIAO, UGE, LAMA, MSTIC ED 532, PhD Mathematics, Mathematical Statistical Mechanics, Probability, Random Interfaces, Sorbonne Université, M2-PMA">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace:'index.html','' }}" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yuguang XIAO">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | replace:'index.html','' }}">
<meta property="og:image" content="{{ site.url }}/assets/img/yuguang-xiao-snow-portrait.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ site.url }}/assets/img/yuguang-xiao-snow-portrait.jpg">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A18" media="(prefers-color-scheme: dark)">

  "email": {{ site.author.email | prepend: 'mailto:' | jsonify }},
  "telephone": {{ site.data.profile.phone | jsonify }},
  "workLocation": {
    "@type": "Place",
    "name": "LAMA, UPEC site",
    "address": {
      "@type": "PostalAddress",

    }
  },
  "affiliation": {
    "@type": "CollegeOrUniversity",

    "https://lama-umr8050.fr/membres/xiao.yuguang",
    "https://github.com/Lucien-XIAO",
    "https://www.linkedin.com/in/yuguang-xiao-00b1281ba/"
  ]
}
</script>
