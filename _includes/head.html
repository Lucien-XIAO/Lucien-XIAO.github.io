<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% else %}
<meta name="description"
    content="Yuguang XIAO is a researcher in probability and mathematical statistical mechanics, working on long-range Ising models and random interfaces. Incoming PhD researcher at Université Gustave Eiffel in October 2026.">
{% endif %}
<meta name="keywords"
    content="Yuguang XIAO, Sorbonne Université, M2-PMA, Probability and Random Models, Stochastic Processes, Master's Degree, Double Bachelor's Degree, Mathematics, Physics">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | replace:'index.html','' }}" />
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="Yuguang XIAO — probability, statistical mechanics, stochastic processes, and random interfaces.">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | replace:'index.html','' }}">
<meta property="og:image" content="{{ site.url }}/assets/img/yuguang-xiao-portrait.jpg">
<link rel="icon" href="/assets/img/yuguang-xiao-portrait.jpg?v=2" type="image/jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css
    crossorigin=anonymous>
<link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=1">
<link rel="stylesheet" href="/assets/css/font_sans_serif.css">
<link rel="stylesheet" href="/assets/css/style-no-dark-mode_old.css">
<link rel="stylesheet" href="/assets/css/publications-no-dark-mode_old.css">
<link rel="stylesheet" href="/assets/css/theme-claude.css?v=37">
<script src="/assets/js/site-i18n.js?v=46" defer></script>
{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
{% endif %}
<script>
  (function() {
    document.documentElement.classList.add('js');
    var theme = localStorage.getItem('theme');
    if (theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }
  })();
</script>
<title>{{ page.title }}</title>
