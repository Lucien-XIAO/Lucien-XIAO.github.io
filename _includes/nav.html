<nav class="top-nav">
  <div class="nav-container">
    <div class="nav-left">
      <a href="/" data-i18n="nav.home" {% if page.url == "/" %}class="nav-active"{% endif %}>Home</a>
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url }}"
          data-i18n="{{ item.i18n_key }}"
          {% if page.url contains item.url %}class="nav-active"{% endif %}>
          {{ item.title }}
        </a>
      {% endfor %}
    </div>
    <div class="nav-right">
      <div class="language-switcher" data-language-switcher aria-label="Language selector">
        <button type="button" class="language-flag" data-lang-option="en" title="Switch to English" aria-label="Switch to English">🇬🇧</button>
        <button type="button" class="language-flag" data-lang-option="fr" title="Switch to French" aria-label="Switch to French">🇫🇷</button>
        <button type="button" class="language-flag" data-lang-option="zh" title="Switch to Chinese" aria-label="Switch to Chinese">🇨🇳</button>
      </div>
      <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode" aria-label="Toggle dark mode"
        data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button class="hamburger" id="hamburgerBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileNav">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </div>
  <!-- Mobile navigation overlay -->
  <div class="mobile-nav-overlay" id="mobileNav" aria-hidden="true">
    <div class="mobile-nav-panel">
      <a href="/" data-i18n="nav.home" {% if page.url == "/" %}class="mobile-nav-active"{% endif %}>Home</a>
      {% for item in site.data.navigation.main %}
        <a href="{{ item.url }}"
          data-i18n="{{ item.i18n_key }}"
          {% if page.url contains item.url %}class="mobile-nav-active"{% endif %}>
          {{ item.title }}
        </a>
      {% endfor %}
    </div>
  </div>
</nav>
<script>
  (function () {
    const labels = {
      en: { en: "Switch to English", fr: "Passer en anglais", zh: "切换到英文" },
      fr: { en: "Switch to French", fr: "Passer en français", zh: "切换到法语" },
      zh: { en: "Switch to Chinese", fr: "Passer en chinois", zh: "切换到中文" },
    };
    const normalize = (value) => {
      const lang = String(value || "").toLowerCase();
      if (lang.startsWith("zh")) return "zh";
      if (lang.startsWith("fr")) return "fr";
      return "en";
    };
    const syncFlags = (language) => {
      const current = normalize(language || document.documentElement.dataset.language || document.documentElement.dataset.defaultLang || document.documentElement.lang);
      document.querySelectorAll("[data-lang-option]").forEach((button) => {
        const target = normalize(button.dataset.langOption);
        const hidden = target === current;
        button.hidden = hidden;
        button.setAttribute("aria-hidden", hidden ? "true" : "false");
        const label = labels[target] && labels[target][current];
        if (label) {
          button.title = label;
          button.setAttribute("aria-label", label);
        }
      });
    };
    document.addEventListener("DOMContentLoaded", () => window.setTimeout(() => syncFlags(), 0));
    window.addEventListener("site-language-change", (event) => syncFlags(event.detail && event.detail.language));
    document.addEventListener("click", (event) => {
      const button = event.target.closest && event.target.closest("[data-lang-option]");
      if (!button) return;
      if (window.SiteI18n && typeof window.SiteI18n.applyLanguage === "function") {
        window.SiteI18n.applyLanguage(button.dataset.langOption);
      } else {
        let requestEvent;
        if (typeof window.CustomEvent === "function") {
          requestEvent = new window.CustomEvent("site-language-request", {
            detail: { language: button.dataset.langOption }
          });
        } else {
          requestEvent = document.createEvent("CustomEvent");
          requestEvent.initCustomEvent("site-language-request", false, false, {
            language: button.dataset.langOption
          });
        }
        window.dispatchEvent(requestEvent);
      }
      window.setTimeout(() => syncFlags(), 60);
    });
  })();
</script>
<script>
  (function () {
    const btn = document.getElementById('hamburgerBtn');
    const overlay = document.getElementById('mobileNav');
    if (!btn || !overlay) return;

    const toggle = (open) => {
      const isOpen = typeof open === 'boolean' ? open : !overlay.classList.contains('is-open');
      overlay.classList.toggle('is-open', isOpen);
      btn.classList.toggle('is-active', isOpen);
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      overlay.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
      document.body.style.overflow = isOpen ? 'hidden' : '';
    };

    btn.addEventListener('click', () => toggle());
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) toggle(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('is-open')) toggle(false);
    });
  })();
</script>
