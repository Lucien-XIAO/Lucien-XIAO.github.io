<!DOCTYPE html>
<html lang="{{ page.lang | default: 'fr' }}" data-default-lang="{{ page.lang | default: 'fr' }}">
<head>
  <script src="/assets/js/pma-i18n.js?v=4" defer></script>
  {% include head.html %}
  <link rel="stylesheet" href="/assets/css/pma-theme.css?v=9">
  <link rel="stylesheet" href="/assets/css/editorial.css?v=1">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body class="theme-claude pma-page">
  {% include nav.html %}
  <div class="pma-campus-strip" aria-label="Campus Jussieu, Sorbonne Université, Paris" data-i18n-aria-label="pma.campus.caption">
    <img src="/assets/img/pma-campus-strip.jpg?v=2" alt="Campus Jussieu, Sorbonne Université, Paris" data-i18n-alt="pma.campus.caption" decoding="async" fetchpriority="high" />
    <span class="pma-campus-caption" data-i18n="pma.campus.caption">Campus Jussieu, Sorbonne Université, Paris</span>
  </div>
  <div class="pma-wrapper">
    <nav class="pma-breadcrumb">
      <a href="/"><i class="fa-solid fa-house"></i> <span data-i18n="pma.breadcrumb.home">Accueil</span></a>
      {% if page.parent_title %}
        <span class="breadcrumb-sep">›</span>
        <a href="{{ page.parent_url }}">{{ page.parent_title }}</a>
      {% endif %}
      {% if page.breadcrumb %}
        <span class="breadcrumb-sep">›</span>
        <span>{{ page.breadcrumb }}</span>
      {% endif %}
    </nav>
    <main class="pma-main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="/assets/js/site.js?v=3" defer></script>
</body>
</html>
