<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" data-default-lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="theme-claude has-paris-strip">
  {% include math_float.html %}
  {% include nav.html %}
  <div class="paris-photo-strip" aria-label="Paris skyline">
    <img src="/assets/img/paris-banner.jpg?v=2" alt="Paris skyline at night over the Seine" decoding="async" />
    <span class="photo-strip-caption">Paris at night over the Seine</span>
  </div>
  <div class="wrapper">
    {% include sidebar.html %}
    <section class="content">
      {{ content }}
    </section>
    {% include footer.html %}
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.nav-active')?.scrollIntoView({ block: 'nearest', inline: 'center' });

      const decodeContact = (value) => value
        .split('-')
        .map((code) => String.fromCharCode(Number(code) - 7))
        .join('');

      const contactMessages = {
        en: 'Email copied to clipboard',
        fr: 'Adresse e-mail copiée',
        zh: '邮箱地址已复制',
      };

      const currentLanguage = () => {
        const lang = (document.documentElement.lang || document.documentElement.dataset.language || 'en').toLowerCase();
        if (lang.startsWith('zh')) return 'zh';
        if (lang.startsWith('fr')) return 'fr';
        return 'en';
      };

      let contactToastTimer;
      const showContactToast = (message) => {
        let toast = document.querySelector('.contact-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.className = 'contact-toast';
          toast.setAttribute('role', 'status');
          toast.setAttribute('aria-live', 'polite');
          document.body.appendChild(toast);
        }

        toast.textContent = message;
        window.clearTimeout(contactToastTimer);
        toast.classList.add('is-visible');
        contactToastTimer = window.setTimeout(() => {
          toast.classList.remove('is-visible');
        }, 1600);
      };

      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (error) {
            // Fall back to the selection-based copy path below.
          }
        }

        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        try {
          return document.execCommand('copy');
        } finally {
          textarea.remove();
        }
      };

      document.querySelectorAll('.js-email-link[data-contact-code]').forEach((link) => {
        link.addEventListener('click', async (event) => {
          event.preventDefault();

          const email = decodeContact(link.dataset.contactCode || '');
          const targetSelector = link.dataset.emailTarget;
          const target = targetSelector ? document.querySelector(targetSelector) : null;
          const fallbackText = email.replace('@', ' [at] ').replace(/\./g, ' dot ');

          try {
            const copied = await copyText(email);
            if (!copied) throw new Error('Copy unavailable');
            showContactToast(contactMessages[currentLanguage()]);
          } catch (error) {
            if (target) target.textContent = fallbackText;
            showContactToast(contactMessages[currentLanguage()]);
          }
        });
      });

      /* IntersectionObserver: reveal sections on scroll */
      const sections = document.querySelectorAll('.section');
      const revealObserver = window.IntersectionObserver
        ? new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                revealObserver.unobserve(entry.target);
              }
            });
          }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' })
        : null;

      sections.forEach((el, index) => {
        el.style.transitionDelay = `${Math.min(index * 60, 300)}ms`;

        if (revealObserver) {
          revealObserver.observe(el);
        } else {
          el.classList.add('visible');
        }

        const title = el.querySelector('.section-title');
        const body = el.querySelector('.section-body');
        if (!title || !body) return;

        const sectionId = el.id || `section-${index + 1}`;
        if (!el.id) el.id = sectionId;
        if (!body.id) body.id = `${sectionId}-body`;

        el.classList.add('is-collapsible');
        title.setAttribute('role', 'button');
        title.setAttribute('tabindex', '0');
        title.setAttribute('aria-controls', body.id);
        title.setAttribute('aria-expanded', 'true');

        const openSection = () => {
          el.classList.remove('is-collapsed');
          title.setAttribute('aria-expanded', 'true');
          body.style.height = '0px';
          body.offsetHeight;
          body.style.height = `${body.scrollHeight}px`;
        };

        const closeSection = () => {
          title.setAttribute('aria-expanded', 'false');
          body.style.height = `${body.scrollHeight}px`;
          body.offsetHeight;
          el.classList.add('is-collapsed');
          body.style.height = '0px';
        };

        const toggleSection = () => {
          if (el.classList.contains('is-collapsed')) {
            openSection();
          } else {
            closeSection();
          }
        };

        body.addEventListener('transitionend', (event) => {
          if (event.target === body && event.propertyName === 'height' && !el.classList.contains('is-collapsed')) {
            body.style.height = 'auto';
          }
        });

        title.addEventListener('click', toggleSection);
        title.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleSection();
          }
        });
      });
    });
    
    const toggle = document.getElementById('themeToggle');
    if (toggle) {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        toggle.innerHTML = saved === 'dark'
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
      }
      toggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggle.innerHTML = next === 'dark'
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
      });
    }
  </script>
</body>
</html>
