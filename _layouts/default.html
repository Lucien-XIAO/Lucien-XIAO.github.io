<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" data-default-lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="theme-claude{% if page.url == '/' %} home-page{% endif %}">
  <a class="skip-link" href="#main-content" data-i18n="accessibility.skip">Skip to main content</a>
  {% include nav.html %}
  <div class="wrapper">
    {% unless page.url == "/" %}
      {% include sidebar.html %}
    {% endunless %}
    <main class="content" id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="/assets/js/site.js?v=2" defer></script>
  {% if page.url == "/" %}
  <script src="/assets/js/home-research-animation.js?v=1" defer></script>
  {% endif %}
</body>
</html>
