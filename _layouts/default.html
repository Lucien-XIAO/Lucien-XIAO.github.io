<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" data-default-lang="{{ page.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="theme-claude has-paris-strip">
  <a class="skip-link" href="#main-content" data-i18n="accessibility.skip">Skip to main content</a>
  {% include math_float.html %}
  {% include nav.html %}
  <div class="paris-photo-strip" aria-label="Paris skyline">
    <img src="/assets/img/paris-banner.jpg?v=2" alt="Paris skyline at night over the Seine" decoding="async" fetchpriority="high" />
    <span class="photo-strip-caption">Paris at night over the Seine</span>
  </div>
  <div class="wrapper">
    {% include sidebar.html %}
    <main class="content" id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="/assets/js/site.js?v=1" defer></script>
</body>
</html>
